<!DOCTYPE html>
<html lang="uk">

    <title>Система управління готелем</title>
    <link rel="stylesheet" href="css/style.css">

    <main>

        <section id="rooms-section">
            <h2>Номерний фонд</h2>
            <div id="rooms-container">
                <!-- Дані завантажуватимуться динамічно через app.js -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Курсовий проєкт. Спеціальність 126.</p>
    </footer>

    <script src="js/app.js"></script>
