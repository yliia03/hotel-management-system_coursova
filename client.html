<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Готель — Клієнтська сторінка</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Готель «Комфорт»</h1>
        <p>Перегляд доступних номерів та бронювання</p>
    </header>

    <main>
        <div id="status-message" class="message-box hidden"></div>

        <section>
            <h2>Доступні номери</h2>
            <div id="rooms-loader" class="loader">Завантаження номерів...</div>
            <div id="rooms-container"></div>
        </section>
    </main>

    <footer>
        <p>Система управління готелем &copy; 2026</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
